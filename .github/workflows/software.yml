name: Software checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python3 tools/test_repository_hygiene.py
      - run: python3 tools/check_repository.py
      - run: python3 tools/verify_firmware_offline.py
      - run: npm ci && npm test && npm run build && npm audit --audit-level=low
        working-directory: web
      - run: git diff --exit-code -- web/public/THIRD_PARTY_NOTICES.txt
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.11'
          cache: false
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: gitleaks git . --log-opts=--all --redact --max-archive-depth 3
      - run: gitleaks dir . --redact --max-archive-depth 3
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Gradle wrapper
        run: echo 'd3b261c2820e9e3d8d639ed084900f11f4a86050a8f83342ade7b6bc9b0d2bdd  mobile/android/gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
      - run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
        working-directory: mobile/android
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build for an available iPhone simulator
        run: |
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if "iPhone" in v["name"]))')
          xcodebuild -project mobile/ios/Myohm.xcodeproj -scheme Myohm -destination "platform=iOS Simulator,id=$simulator_id" -derivedDataPath "$RUNNER_TEMP/myohm-ios" CODE_SIGNING_ALLOWED=NO build
# Full NCS builds and KiCad ERC/DRC require their separate pinned toolchains.
# These jobs do not establish physical BLE, electrical safety or CAD redistribution rights.
